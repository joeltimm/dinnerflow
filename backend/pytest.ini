[pytest]
# Tests run from /app (the backend root) so top-level modules import cleanly
# (config, auth.*, routers.*, services.*) — matching how the app imports them.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra -q
filterwarnings =
    ignore::DeprecationWarning
