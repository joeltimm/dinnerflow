x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ── Database ───────────────────────────────────────────────────────────────
  dinner-db:
    image: pgvector/pgvector:pg15
    container_name: dinner-db
    logging: *default-logging
    environment:
      - POSTGRES_DB=${DINNER_DB_NAME}
      - POSTGRES_USER=${DINNER_DB_USER}
      - POSTGRES_PASSWORD=${DINNER_DB_PASSWORD}
    volumes:
      - dinner_postgres_data:/var/lib/postgresql/data
    networks:
      - app-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DINNER_DB_USER} -d ${DINNER_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5436:5432"

  # ── Redis (Celery broker + result backend) ─────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ironskillet_redis
    logging: *default-logging
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI backend ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: ironskillet_backend
    logging: *default-logging
    restart: unless-stopped
    environment:
      - DINNER_DB_NAME=${DINNER_DB_NAME}
      - DINNER_DB_USER=${DINNER_DB_USER}
      - DINNER_DB_PASSWORD=${DINNER_DB_PASSWORD}
      - DINNER_DB_HOST=dinner-db
      - DINNER_DB_PORT=5432
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:?Set LLM_BASE_URL in .env}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text-v1.5-q5_k_m}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - UPLOADS_PATH=/app/uploads
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost}
      - REDIS_URL=redis://redis:6379/0
      # Email via the host Postfix relay (reached over the host-gateway).
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_FROM=${SMTP_FROM:-noreply@joeltimm.dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Recipe image uploads — persisted on host (set UPLOADS_HOST_PATH in .env)
      - ${UPLOADS_HOST_PATH:-./uploads}:/app/uploads
    # Port 8000 on the host is taken by gohttpserver.
    # nginx (web container) reaches the backend over the internal app-net network,
    # so no host-port binding is needed for normal operation.
    # Expose on 8010 only if you need direct API access for debugging.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:8010:8000"
    networks:
      - app-net
      - homelab_backend   # so homelab-prometheus-1 can scrape by container name
    depends_on:
      dinner-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery worker (background tasks: emails, LLM, meal plans) ─────────────
  celery-worker:
    build: ./backend
    container_name: ironskillet_worker
    logging: *default-logging
    restart: unless-stopped
    command: ["celery", "-A", "celery_app", "worker",
              "--loglevel=info", "--concurrency=8"]
    # Worker exposes its in-task custom metrics here (started in celery_app via
    # the worker_init signal). Prometheus scrapes 127.0.0.1:9111/metrics.
    ports:
      - "127.0.0.1:9111:9111"
    environment:
      # Celery's worker resolves the implicit '' sys.path entry against its
      # runtime cwd, so deferred imports like `from services.email ...` fail.
      # Pin /app so package imports work regardless of cwd.
      - PYTHONPATH=/app
      - DINNER_DB_NAME=${DINNER_DB_NAME}
      - DINNER_DB_USER=${DINNER_DB_USER}
      - DINNER_DB_PASSWORD=${DINNER_DB_PASSWORD}
      - DINNER_DB_HOST=dinner-db
      - DINNER_DB_PORT=5432
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:?Set LLM_BASE_URL in .env}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o-mini}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - EMBED_MODEL=${EMBED_MODEL:-nomic-embed-text-v1.5-q5_k_m}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
      - UPLOADS_PATH=/app/uploads
      - REDIS_URL=redis://redis:6379/0
      # Email via the host Postfix relay (the worker is what actually sends).
      - SMTP_HOST=${SMTP_HOST:-host.docker.internal}
      - SMTP_PORT=${SMTP_PORT:-25}
      - SMTP_FROM=${SMTP_FROM:-noreply@joeltimm.dev}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${UPLOADS_HOST_PATH:-./uploads}:/app/uploads
    networks:
      - app-net
      - homelab_backend   # so homelab-prometheus-1 can scrape by container name
    depends_on:
      dinner-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Celery Beat (cron scheduler — single instance only) ───────────────────
  celery-beat:
    build: ./backend
    container_name: ironskillet_beat
    logging: *default-logging
    restart: unless-stopped
    command: ["celery", "-A", "celery_app", "beat",
              "--loglevel=info"]
    environment:
      - PYTHONPATH=/app
      - DINNER_DB_NAME=${DINNER_DB_NAME}
      - DINNER_DB_USER=${DINNER_DB_USER}
      - DINNER_DB_PASSWORD=${DINNER_DB_PASSWORD}
      - DINNER_DB_HOST=dinner-db
      - DINNER_DB_PORT=5432
      - FERNET_KEY=${FERNET_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - REDIS_URL=redis://redis:6379/0
    networks:
      - app-net
      - homelab_backend   # so homelab-prometheus-1 can scrape by container name
    depends_on:
      redis:
        condition: service_healthy

  # ── React frontend (nginx) ─────────────────────────────────────────────────
  web:
    build: ./web
    container_name: ironskillet_web
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - app-net
      - homelab_backend   # so homelab-prometheus-1 can scrape by container name
    depends_on:
      backend:
        condition: service_healthy

  # ── Observability exporters ────────────────────────────────────────────────
  # All bind to 127.0.0.1 only — your host-level Prometheus scrapes them locally.
  # See monitoring/prometheus-scrape.yml for the scrape config to paste in.

  # Host CPU / memory / disk / network / filesystem.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: ironskillet_node_exporter
    logging: *default-logging
    restart: unless-stopped
    command:
      - "--path.rootfs=/host"
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "127.0.0.1:9100:9100"
    networks:
      - homelab_backend

  # Per-container CPU / memory / network for every service in this compose.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: ironskillet_cadvisor
    logging: *default-logging
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    ports:
      - "127.0.0.1:9101:8080"
    networks:
      - homelab_backend

  # PostgreSQL internals + custom Iron Skillet business gauges (recipes, users,
  # cooks, ratings, embedding coverage, …) — see monitoring/postgres_queries.yaml.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: ironskillet_postgres_exporter
    logging: *default-logging
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${DINNER_DB_USER}:${DINNER_DB_PASSWORD}@dinner-db:5432/${DINNER_DB_NAME}?sslmode=disable
      - PG_EXPORTER_EXTEND_QUERY_PATH=/etc/postgres_exporter/queries.yaml
    volumes:
      - ./monitoring/postgres_queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "127.0.0.1:9187:9187"
    networks:
      - app-net
      - homelab_backend   # so homelab-prometheus-1 can scrape by container name
    depends_on:
      dinner-db:
        condition: service_healthy

  # Redis broker health, memory, ops, and Celery queue length (db 0 list keys).
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: ironskillet_redis_exporter
    logging: *default-logging
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      # Surface the Celery queue backlog as a metric (key_size for the list).
      - REDIS_EXPORTER_CHECK_KEYS=celery
    ports:
      - "127.0.0.1:9121:9121"
    networks:
      - app-net
      - homelab_backend   # so homelab-prometheus-1 can scrape by container name
    depends_on:
      redis:
        condition: service_healthy

  # Celery task lifecycle: sent/started/succeeded/failed/runtime per task,
  # active workers, queue length. Reads task events from the Redis broker.
  celery-exporter:
    image: danihodovic/celery-exporter:latest
    container_name: ironskillet_celery_exporter
    logging: *default-logging
    restart: unless-stopped
    environment:
      - CE_BROKER_URL=redis://redis:6379/0
    ports:
      - "127.0.0.1:9808:9808"
    networks:
      - app-net
      - homelab_backend   # so homelab-prometheus-1 can scrape by container name
    depends_on:
      redis:
        condition: service_healthy

networks:
  app-net:
    # Internal network shared by dinner-db, backend, and web (nginx)
    name: ironskillet-app-net
  homelab_backend:
    # Pre-existing network where homelab-prometheus-1 lives. Joined by the
    # backend/worker/exporters so Prometheus can scrape them by container name.
    external: true
    name: homelab_backend

volumes:
  redis_data:
  # Compose-internal alias "dinner_postgres_data" maps to the external Docker
  # volume named "dinnerflow_postgres_data". Create it once before first run:
  #   docker volume create dinnerflow_postgres_data
  # Kept external so `docker compose down -v` cannot accidentally destroy data.
  dinner_postgres_data:
    external: true
    name: dinnerflow_postgres_data
