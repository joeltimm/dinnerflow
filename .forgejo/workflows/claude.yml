name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    # See claude-auto-review.yml: route API writes to the Forgejo container
    # on the docker bridge, bypassing Cloudflare's managed challenge.
    env:
      GITHUB_API_URL: http://172.21.0.4:3000/api/v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        # Forgejo-compatible fork of anthropics/claude-code-action (instance mirror).
        uses: https://git.joeltimm.dev/joelrocks/claude-code-action@main
        with:
          # Auth is the Claude Code subscription (OAuth token) only — the paid
          # pay-per-token anthropic_api_key route is intentionally not used.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Forgejo platform — bot user provisioned with write access on this repo.
          platform: "forgejo"
          github_token: ${{ secrets.CLAUDE_BOT_TOKEN }}
          bot_id: "2"
          bot_name: "claude-bot"
          bot_email: "claude-bot@git.joeltimm.dev"

          # Lets Claude read CI results when reviewing PRs.
          additional_permissions: |
            actions: read

          # No custom prompt — when triggered by an @claude mention, Claude
          # follows the instructions in the comment that tagged it.
